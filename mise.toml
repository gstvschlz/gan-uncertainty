[tools]
micromamba = "2.9.0-0"

[env]
# The conda environment in .conda/ (Windows layout, then Linux/macOS)
_.path = [".conda", ".conda/Scripts", ".conda/Library/bin", ".conda/bin"]

[tasks.setup]
description = "Create the conda environment in .conda/ from environment.yml"
run = "micromamba create -y -p \"{{config_root}}/.conda\" -f environment.yml"

[tasks.train]
description = "Train the WGAN-GP (GPU optional); flags: --seed --steps --eval_every"
run = "python src/generative_model/gan.py"

[tasks.sample]
description = "Generate the TI catalog into outputs/ (flags: --num_samples --seed)"
run = "python src/generative_model/sampling.py"

[tasks.snesim]
description = "Single-TI baseline plus one SNESIM realization per catalog TI (boitata)"
run = "python scripts/run_snesim.py"

[tasks.figures]
description = "Paper figures into outputs/figures/"
run = "python src/figures.py"

[tasks.gifs]
description = "Generate docs/*.gif (flags: names, --seed, --frames, --keys, --steps, --out)"
run = "python scripts/gifs.py"

[tasks.docs]
description = "Verify the Pages site: links resolve, GIFs present, docs/ <= 5 MB"
run = "python scripts/docs_check.py"

[tasks.check]
description = "compileall + catalog shape + facies-proportion assertion"
run = "python scripts/check.py"

[tasks.all]
description = "Run the whole pipeline"
run = [
  { task = "setup" },
  { task = "train" },
  { task = "sample" },
  { task = "snesim" },
  { task = "figures" },
  { task = "gifs" },
  { task = "docs" },
  { task = "check" },
]
